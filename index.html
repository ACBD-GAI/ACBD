<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACEBEDO OPTICAL</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#eef2f7;
    font-family:Arial,sans-serif;
}

.card{
    background:#fff;
    padding:40px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

h2{
    color:#1976d2;
}

p{
    color:#555;
}

select{
    width:300px;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:15px;
    background:linear-gradient(135deg,#e3f2fd,#fff);
    color:#1976d2;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    outline:none;
    box-shadow:0 5px 15px rgba(0,0,0,.12);
}

button{
    width:300px;
    margin-top:20px;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#1976d2;
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#1565c0;
}
</style>
</head>

<body>

<div class="card">

<h2>
<img src="https://drive.google.com/thumbnail?id=1U9kmQ7qummOCpVppdLtmVaugMuzLYUWQ&sz=w200"
style="width:60px;height:60px;vertical-align:middle;margin-right:10px;">
ACEBEDO OPTICAL
</h2>

<p>Select Branch</p>

<select id="branch">

<option value="">🏢 SELECT BRANCH</option>

<option value="https://acbd-gai.github.io/dashboards/">🏢 DASHBOARD</option>

<option value="https://acbd-gai.github.io/SOLD-BAC/">🏬 BACOLOD</option>

<option value="">🏬 BINALBAGAN</option>

<option value="">🏬 BISLIG</option>

<option value="">🏬 CADIZ</option>

<option value="https://acbd-gai.github.io/ACBDCAS/">🏬 CASA PLAZA</option>

<option value="">🏬 DUMAGUETE</option>

<option value="https://acbd-gai.github.io/GAI-ILO/">🏬 GAISANO ILOILO</option>

<option value="">🏬 KABANKALAN</option>

<option value="">🏬 KALIBO</option>

<option value="">🏬 PASSI</option>

<option value="">🏬 POTOTAN</option>

<option value="">🏬 SAN CARLOS</option>

<option value="">🏬 TABUNOK</option>

<option value="">🏬 TANDAG</option>

<option value="">🏬 TISA</option>

<option value="">🏬 TOLEDO</option>

</select>

<button onclick="openBranch()">OPEN</button>

</div>

<script>
function openBranch(){

const url=document.getElementById("branch").value;

if(!url){
alert("Branch link not available.");
return;
}

window.location.href=url;

}
</script>

</body>
</html>
